<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="timer.css" />
    <title>Timer-stop watch using js</title>
  </head>

  <body>
    <div class="main1">
      <h1>Timer</h1>
      <h2>Stop watch</h2>
      <p>
        Check you time - it's passing continuously use it right or you will lose it
      </p>
    </div>

    <div class="main2">
      <div class="Timer_display" id="timerDisplay">00 : 00 : 00</div>
      <div class="btns">
        <button class="start" id="startbtn">Start</button>
        <button class="stop" id="stopbtn">Stop</button>
        <button class="restart" id="resetbtn">Restart</button>
      </div>
    </div>
    <div class="mainhor"></div>
    <div class="main3"></div>

    <script src="timer.js"></script>
  </body>
</html>
